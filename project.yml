name: Rhapsode
options:
  bundleIdPrefix: com.naufalmir
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: en
    # Free provisioning during development — no paid entitlements in the MVP.
    CODE_SIGN_STYLE: Automatic
    # Personal team for free on-device provisioning. Persisted here so it
    # survives `xcodegen generate` (the .xcodeproj is regenerated + gitignored).
    DEVELOPMENT_TEAM: U92LTX7P84

packages:
  # Readium Streamer only — EPUB metadata + cover import. Rendering is Foliate-js
  # (WKWebView). Navigator / GCDWebServer were removed in reader Path 1c.
  Readium:
    url: https://github.com/readium/swift-toolkit
    exactVersion: 3.9.0
  # Local SPM package (the SmartSpeech silence-analysis DSP). Path is relative to the repo root.
  SmartSpeechKit:
    path: SmartSpeechKit
  # SMB2/3 client (vendored 4.0.3, static link — see Packages/AMSMB2/Package.swift).
  # Upstream dynamic product breaks Mac Catalyst (dyld Team ID mismatch).
  AMSMB2:
    path: Packages/AMSMB2

targets:
  Rhapsode:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      # Sample fixtures bundled as a folder reference (preserves subdirectories
      # so MockLibrarySource can enumerate them at runtime). Dev/testing only.
      - path: Fixtures/SampleLibrary
        type: folder
        buildPhase: resources
      # Bundled IBM Plex Mono (OFL) — the Nerd Stats / per-book receipt typeface.
      - path: SupportingFiles/Fonts
        buildPhase: resources
      # Bundled Literata + Atkinson Hyperlegible (OFL) — served to Foliate via rhapsode://reader/fonts/.
      - path: SupportingFiles/ReaderFonts
        buildPhase: resources
      # Foliate-js EPUB shell (custom scheme rhapsode://reader/…).
      - path: SupportingFiles/ReaderWeb
        type: folder
        buildPhase: resources
      # Upstream foliate-js modules (served as rhapsode://reader/foliate-js/…).
      - path: Vendor/foliate-js
        type: folder
        buildPhase: resources
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: SmartSpeechKit
        product: SmartSpeechKit
      - package: AMSMB2
        product: AMSMB2
    # Explicit (not auto-generated) Info.plist: the auto-generated plist only
    # supports a whitelist of INFOPLIST_KEY_* settings, and we need arbitrary keys
    # — UIBackgroundModes now, a CFBundleURLTypes OAuth callback scheme in Phase 1.
    info:
      path: SupportingFiles/Info.plist
      properties:
        CFBundleDisplayName: Rhapsode
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Lock-screen / Control Center audio control needs the audio background
        # mode. Free to declare; doing it now avoids an entitlements retrofit.
        UIBackgroundModes:
          - audio
          - fetch
        # Bundled fonts (registered so Font.custom can resolve them):
        # IBM Plex Mono = data/receipt face; Hanken Grotesk = display face (titles + big stat numbers).
        UIAppFonts:
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
          - IBMPlexMono-Bold.ttf
          - HankenGrotesk-Regular.ttf
          - HankenGrotesk-Medium.ttf
          - HankenGrotesk-SemiBold.ttf
          - HankenGrotesk-Bold.ttf
          - HankenGrotesk-ExtraBold.ttf
        # BGTaskScheduler delta-check while the app is closed (Phase 2 fast-follow).
        # Free feature — no paid entitlement.
        BGTaskSchedulerPermittedIdentifiers:
          - com.naufalmir.rhapsode.refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Phase 4a (iPad): allow multiple windows of the app (Stage Manager,
        # drag-to-new-window, side-by-side same-app). SwiftUI's App lifecycle
        # manages the scenes; no UIWindowSceneSessionRole config needed.
        # rhapsode-server is plain HTTP over Tailscale/LAN.
        # IMPORTANT: do NOT set NSAllowsLocalNetworking alongside
        # NSAllowsArbitraryLoads — on iOS 10+/macOS 10.12+ the presence of
        # NSAllowsLocalNetworking makes NSAllowsArbitraryLoads ignored (effective
        # NO). Tailscale MagicDNS (*.ts.net) is NOT treated as "local networking",
        # so that combo blocked our server. Exception domain covers MagicDNS;
        # NSAllowsArbitraryLoads covers IP/LAN hosts without a domain exception.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: "1.0"
              NSExceptionRequiresForwardSecrecy: false
        # Required for iOS/iPadOS (and some Catalyst paths) to reach LAN IPs.
        NSLocalNetworkUsageDescription: >-
          Rhapsode connects to your self-hosted library server on the local network.
        # Empty Bonjour services array still allows arbitrary local TCP (iOS 14+).
        NSBonjourServices:
          - _http._tcp
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naufalmir.rhapsode
        PRODUCT_NAME: Rhapsode
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad (shared SwiftUI codebase)
        SWIFT_STRICT_CONCURRENCY: complete
        # Phase 4b — Mac Catalyst (feasibility probe). Shares the UIKit codebase
        # incl. Readium's UIKit navigator (no native AppKit reader exists).
        SUPPORTS_MACCATALYST: "YES"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: "NO"
        # Phase 4b (macOS Catalyst) — Keychain entitlement for storing the Dropbox
        # OAuth token. Resolves Keychain -34018 (errSecMissingEntitlement) errors.
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/Rhapsode.entitlements

# Generate a SHARED Rhapsode scheme so it survives `xcodegen generate` (Xcode was only
# autocreating a user scheme, which a regenerate wiped — breaking `xcodebuild -scheme Rhapsode`).
schemes:
  Rhapsode:
    build:
      targets:
        Rhapsode: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
